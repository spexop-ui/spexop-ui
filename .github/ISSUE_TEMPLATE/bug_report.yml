name: Bug report
description: Report a reproducible problem in the current source or documentation
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "This is development source, not a released desktop app. Do not include secrets, personal data, or private project files. Report vulnerabilities through SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal safe example and the expected behavior.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or branch
      description: Provide the exact revision if possible.
  - type: textarea
    id: environment
    attributes:
      label: Environment and checks
      description: Include OS, Node/pnpm versions, commands, browser/device if relevant, and observed results.
